clean_rooms:
  target:
    entity:
      integration: narwal_cloud
      domain: vacuum
  fields:
    rooms:
      required: true
      example: ["Kitchen", "Hallway"]
      selector:
        text:
          multiple: true
    method:
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - start_clean
            - easy_clean
    mode:
      required: false
      selector:
        select:
          options:
            - vacuum
            - mop
            - vacuum_and_mop
            - vacuum_then_mop
    suction:
      required: false
      selector:
        select:
          options:
            - ai
            - quiet
            - standard
            - strong
            - super_powerful
    passes:
      required: false
      selector:
        number:
          min: 1
          max: 3
          mode: box
